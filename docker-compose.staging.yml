services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mymemo_staging_db
    environment:
      POSTGRES_USER: ${DB_USER:-lifelogs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-lifelogs_db}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lifelogs_user} -d ${DB_NAME:-lifelogs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mymemo_staging_redis
    volumes:
      - redis_data_staging:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: mymemo_staging_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-lifelogs_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-lifelogs_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=staging
      - DEBUG=true
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_IMAGES=${S3_BUCKET_IMAGES}
      - S3_BUCKET_THUMBNAILS=${S3_BUCKET_THUMBNAILS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      # Permite peticiones desde la IP de Tailscale
      - ALLOWED_ORIGINS=http://100.67.125.25:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: mymemo_staging_celery
    command: celery -A tasks.celery_app worker --loglevel=info --pool=threads --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-lifelogs_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-lifelogs_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=staging
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_IMAGES=${S3_BUCKET_IMAGES}
      - S3_BUCKET_THUMBNAILS=${S3_BUCKET_THUMBNAILS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mymemo_staging_nginx
    ports:
      # Solo escucha peticiones que vengan por el túnel de Tailscale
      - "100.67.125.25:8080:80"
    volumes:
      - ./deployment/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data_staging:
  redis_data_staging:
